name: PS2Recomp host tools

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps2recomp-host-tools.yml"
      - "external/PS2Recomp"
      - "tools/**"
      - "docs/XFF_LINKER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-host-tools:
    name: Build ps2_analyzer and ps2_recomp (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned PS2Recomp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure PS2Recomp host build
        run: |
          cmake -S external/PS2Recomp -B build/ps2recomp-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_RECOMP=ON \
            -DPS2X_BUILD_RUNTIME=OFF \
            -DPS2X_BUILD_ANALYZER=ON \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_STUDIO=OFF

      - name: Build analyzer and recompiler
        run: cmake --build build/ps2recomp-host --target ps2_analyzer ps2_recomp --parallel 2

      - name: Check tool executables
        shell: bash
        run: |
          test -x build/ps2recomp-host/ps2xAnalyzer/ps2_analyzer
          test -x build/ps2recomp-host/ps2xRecomp/ps2_recomp
          analyzer_help="$(build/ps2recomp-host/ps2xAnalyzer/ps2_analyzer 2>&1 || true)"
          recomp_help="$(build/ps2recomp-host/ps2xRecomp/ps2_recomp 2>&1 || true)"
          printf '%s\n' "$analyzer_help" | grep -q "Usage: ps2_analyzer"
          printf '%s\n' "$recomp_help" | grep -q "Usage: ps2recomp <config.toml>"

      - name: Run synthetic ELF through analyzer and recompiler
        run: |
          python3 tools/smoke_ps2recomp.py \
            --analyzer build/ps2recomp-host/ps2xAnalyzer/ps2_analyzer \
            --recompiler build/ps2recomp-host/ps2xRecomp/ps2_recomp \
            --workdir build/ps2recomp-smoke

      - name: Upload host tools
        uses: actions/upload-artifact@v4
        with:
          name: ps2recomp-host-tools-linux-x86_64
          path: |
            build/ps2recomp-host/ps2xAnalyzer/ps2_analyzer
            build/ps2recomp-host/ps2xRecomp/ps2_recomp
          if-no-files-found: error
